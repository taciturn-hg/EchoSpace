server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: echo-server
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/echospace?serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
#  data:
#    redis:
#      host: localhost
#      port: 6379
#  elasticsearch:
#    uris: http://localhost:9200
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  # Gmail SMTP 配置
  # 授权码获取步骤：
  #   1. 登录 Google 账号 → myaccount.google.com
  #   2. 安全性 → 两步验证（必须先开启）
  #   3. 两步验证页面底部 → 应用专用密码(如果没找到直接访问https://myaccount.google.com/apppasswords，还是没有就换其他邮箱吧)
  #   4. 选择应用"邮件"、设备"其他"，填写名称（如 EchoSpace）→ 生成
  #   5. 复制生成的 16 位密码（格式如 xxxx xxxx xxxx xxxx，去掉空格后填入）
  #   6. 将该密码设置为环境变量 MAIL_PASSWORD，账号设置为 MAIL_USERNAME
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

minio:
  endpoint: http://localhost:9000
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket-name: echospace

oss:
  endpoint: oss-cn-guangzhou.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket-name: echospace

security:
  whitelist:
    - /auth/login
    - /auth/register
    - /auth/refresh
    - /auth/forgot-password
    - /auth/reset-password
    - /error
    - /swagger-ui/**
    - /v3/api-docs/**


